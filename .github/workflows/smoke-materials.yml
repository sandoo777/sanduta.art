name: Smoke Tests Materials

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  smoke-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Start dev server
        run: |
          npm run dev > /tmp/materials-dev.log 2>&1 &
          sleep 20

      - name: Run smoke checks
        run: |
          npx vitest run \
            src/__tests__/MaterialCreateForm.smoke.test.tsx \
            src/__tests__/MaterialCreateForm.test.tsx \
            src/__tests__/api.materials.create.test.ts \
            --reporter=verbose

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: materials-dev-log
          path: /tmp/materials-dev.log
          if-no-files-found: ignore
