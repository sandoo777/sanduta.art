name: Tests

on: [push, pull_request]

jobs:
  unit:
    name: ci:jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run ci:jest

  vitest:
    name: ci:vitest
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: Start test server
        run: npm run start-test-server & sleep 1
      - run: npm run ci:vitest
      - if: failure()
        run: echo "Vitest failed, see logs"

  playwright:
    name: ci:playwright
    runs-on: ubuntu-latest
    needs: vitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npm run ci:playwright
